services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      MEMORY: "6144M"
      MOTD: "minecwaft wittwy"
      USE_AIKAR_FLAGS: "true"
      DIFFICULTY: "3"
      VIEW_DISTANCE: "16"
      SEED: "2026-09-15"
      LEVEL: "2026-09-15"
      OPS: |-
        c097aec3-ac9a-4997-a8e9-9822e6b7b07c
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        c097aec3-ac9a-4997-a8e9-9822e6b7b07c
    volumes:
      - "./data:/data"
    restart: always
