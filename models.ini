# Per-model arguments for llama-server (router mode).
# Managed by NixOS: this file is baked into the nix store and passed to
# the service via --models-preset (see modules/llama.nix).
#
# To change: edit THIS file in the repo, then
#   sudo nixos-rebuild switch --flake ~/my-nixos-config#guillermo
# The rebuild restarts llama-server automatically.
# Do NOT edit the deployed (store) copy — it will be overwritten.
#
# How it works:
#   - Section names must match the model id from:
#       curl -s http://localhost:8080/models | jq '.data[].id'
#     For --models-dir models, that's the directory name under
#     /var/lib/llama-swap/models/.
#   - Keys are CLI arguments without the leading dashes. Short forms (c, ngl)
#     and env var names (LLAMA_ARG_N_GPU_LAYERS) also work.
#     See: llama-server --help
#   - The [*] section applies to every model; per-model sections override it.
#   - Router-controlled args (host, port, api-key, alias, model, hf-repo)
#     are ignored/overridden here — don't set them.
#
# Preset-only options (not real CLI flags):
#   load-on-startup = true|false   load this model when the server boots
#   stop-timeout = N               seconds to wait after unload before force-killing (default 10)

version = 1

[*]
; Defaults shared by all models (uncomment to enable):
; n_ctx = 32768           ; context size (0 = loaded from model)
; n_gpu_layers = auto     ; layers to VRAM ('auto', 'all', or a number)
; n_parallel = 1          ; concurrent slots per model
; flash-attn = auto
; cache-type-k = f16      ; KV cache dtype for K (f32, f16, q8_0, ...)
; cache-type-v = f16      ; KV cache dtype for V
; warmup = true

[Qwen3.6-27B-MTP]
; n_ctx = 32768

[Qwen3.8-27B]
; Multimodal (mmproj-BF16.gguf in dir).
temperature = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
spec-type = draft-mtp
spec-draft-n-max = 3
ngl = 99

[Qwen3.8-27B-UD-Q4_K_XL]
; Multimodal (mmproj-BF16.gguf in dir).
load-on-startup = true  ; load at boot (only sensible with --models-max 1)
temperature = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
spec-type = draft-mtp
spec-draft-n-max = 3
ngl = 99

[Qwen3.6-35B-A3B-MTP]
; MoE model — if loading fails or is slow, keep expert weights on CPU:
; n_cpu_moe = 8           ; keep MoE weights of first N layers in CPU
; n_ctx = 32768

[gemma-4-26B-A4B-it-qat]
; n_ctx = 16384
; Dir has both mmproj-BF16.gguf and mmproj-F16.gguf; router picks the first
; it finds (BF16). Force a specific one:
; mmproj = /var/lib/llama-swap/models/gemma-4-26B-A4B-it-qat/mmproj-F16.gguf

[gemma-4-31B-it-qat]
; n_ctx = 16384

[muse-glimmer]
; n_ctx = 16384
